upstream api_backend {
    server api:4000;
}

upstream web_backend {
    server web:3000;
}

upstream minio_backend {
    server minio:9000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 32M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- API (NestJS) ----------
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120;
    }

    # ---------- Public MinIO bucket (bosh sahifa kartalari va h.k. rasm/fayllari) ----------
    # Brauzer va Next server (next/image) uchun bitta doimiy origin: `/ecobalance-public/...`
    # — MinIO host portiga (9010 kabi) to'g'ridan-to'g'ri bog'lanish shart emas va
    # port o'zgarsa ham rasm manzillari buzilmaydi. Faqat o'qish — yozish MinIO'ga
    # to'g'ridan-to'g'ri (API orqali, ichki tarmoqda) boradi.
    location /ecobalance-public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio_backend/ecobalance-public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=600" always;
    }

    # ---------- Web (Next.js) ----------
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }

    # Next.js HMR websocket
    location /_next/webpack-hmr {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
